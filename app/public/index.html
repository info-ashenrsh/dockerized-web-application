<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockerized Web Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 550px;
            margin: 20px;
            box-shadow: 0 8px 30px #0001;
        }

        h1 { color: #1261a0; }

        .success {
            color: #168447;
            font-weight: bold;
        }

        button {
            background: #1261a0;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐳 Dockerized Web Application</h1>

        <p class="success">
            Application is running successfully!
        </p>

        <p>Welcome to my Docker practical project.</p>

        <h3>Containerization Workflow</h3>

        <p>
            Source Code → Dockerfile → Image →
            Container → Docker Compose
        </p>

        <button onclick="checkHealth()">
            Check Application Health
        </button>

        <p id="result"></p>
    </div>

    <script>
        async function checkHealth() {
            const response = await fetch("/health");
            const data = await response.json();

            document.getElementById("result").textContent =
                data.status + " - " + data.application;
        }
    </script>
</body>
</html>
